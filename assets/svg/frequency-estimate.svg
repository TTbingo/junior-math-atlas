amily="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">8 等份，1 份为红</text><text x="630.0" y="278.0" font-size="11" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">转 200 次，红区停了 26 次</text><text x="630.0" y="298.0" font-size="12" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">频率 26/200 = 0.13</text><text x="630.0" y="318.0" font-size="11" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">于是估计 P ≈ 0.13</text></svg>