<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430"><rect width="700" height="430" fill="#ffffff"/><text x="30.0" y="32.0" font-size="15" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">① 锐角三角函数：对边、邻边、斜边</text><line x1="170.0" y1="300.0" x2="500.0" y2="110.0" stroke="#6b7280" stroke-width="3.0" stroke-linecap="round"/><line x1="170.0" y1="300.0" x2="500.0" y2="300.0" stroke="#2563eb" stroke-width="3.0" stroke-linecap="round"/><line x1="500.0" y1="110.0" x2="500.0" y2="300.0" stroke="#dc2626" stroke-width="3.0" stroke-linecap="round"/><polygon points="488.0,300.0 488.0,288.0 500.0,288.0" fill="none" stroke="#1f2937" stroke-width="1.4" stroke-linejoin="round"/><path d="M 215.1 274.1 A 52 52 0 0 1 222.0 300.0" fill="none" stroke="#dc2626" stroke-width="2.2"/><text x="232.0" y="286.0" font-size="14" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">α</text><path d="M 500.0 158.0 A 48 48 0 0 1 458.4 134.0" fill="none" stroke="#16a34a" stroke-width="2.2"/><text x="468.0" y="144.0" font-size="14" fill="#16a34a" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">β</text><circle cx="170.0" cy="300.0" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="156.0" y="316.0" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">A</text><circle cx="500.0" cy="110.0" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="512.0" y="104.0" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">B</text><circle cx="500.0" cy="300.0" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="516.0" y="310.0" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">C</text><text x="516.0" y="214.0" font-size="14" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">a</text><text x="335.0" y="324.0" font-size="14" fill="#2563eb" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">b</text><text x="322.0" y="190.0" font-size="14" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">c</text><text x="516.0" y="214.0" font-size="10" fill="#dc2626" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif"></text><text x="516.0" y="240.0" font-size="11" fill="#dc2626" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">A 的对边</text><text x="380.0" y="346.0" font-size="11" fill="#2563eb" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">A 的邻边</text><text x="300.0" y="168.0" font-size="11" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">斜边</text><text x="566.0" y="96.0" font-size="12" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">以 A 为准：</text><text x="566.0" y="124.0" font-size="13" fill="#dc2626" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">sin A = a / c</text><text x="566.0" y="150.0" font-size="13" fill="#2563eb" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">cos A = b / c</text><text x="566.0" y="176.0" font-size="13" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">tan A = a / b</text><text x="566.0" y="210.0" font-size="12" fill="#16a34a" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">以 B 为准：</text><text x="566.0" y="238.0" font-size="13" fill="#16a34a" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">sin B = b / c</text><text x="566.0" y="264.0" font-size="13" fill="#16a34a" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">cos B = a / c</text><text x="566.0" y="290.0" font-size="13" fill="#16a34a" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">tan B = b / a</text><line x1="566.0" y1="306.0" x2="686.0" y2="306.0" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/><text x="566.0" y="330.0" font-size="11" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">换到另一个角，</text><text x="566.0" y="352.0" font-size="11" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">a 与 b 就互换</text><text x="566.0" y="382.0" font-size="11" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">斜边 c 始终不变</text></svg>