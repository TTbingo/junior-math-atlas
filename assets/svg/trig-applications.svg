nt-weight="bold">α</text><text x="571.0" y="248.0" font-size="12" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">O</text><text x="660.0" y="168.0" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">l</text><text x="569.0" y="180.0" font-size="12" fill="#2563eb" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">h</text><text x="660.0" y="252.0" font-size="12" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">b</text><text x="536.0" y="222.0" font-size="11" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">地面</text><text x="650.0" y="282.0" font-size="13" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">i = h / b = tan α</text><text x="650.0" y="306.0" font-size="11" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">坡度 i 就是坡角的正切</text><text x="650.0" y="330.0" font-size="12" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">i = 0.75 → 3 : 4 : 5</text></svg>