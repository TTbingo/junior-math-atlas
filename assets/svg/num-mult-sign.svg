<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" role="img" aria-label="左侧是四格符号表，列出正乘正得正、正乘负得负、负乘正得负、负乘负得正；右侧示意三个负因数相乘时两个负号先配对抵消，剩下一个负号使积为负">
  <rect width="520" height="250" fill="#ffffff"/>
  <text x="20" y="24" font-size="13" fill="#2d3748">符号只有一格反直觉：负乘负得正；多个因数时把负号两两配对</text>

  <!-- 符号表 -->
  <g font-size="12.5" fill="#2d3748" text-anchor="middle">
    <text x="78" y="58" fill="#718096">×</text>
    <text x="128" y="58" fill="#718096">正</text>
    <text x="188" y="58" fill="#718096">负</text>
    <text x="46" y="94" fill="#718096">正</text>
    <text x="46" y="134" fill="#718096">负</text>

    <rect x="102" y="70" width="52" height="40" rx="5" fill="#e6fffa" stroke="#cbd5e0"/>
    <text x="128" y="95" fill="#2c7a7b">正</text>
    <rect x="162" y="70" width="52" height="40" rx="5" fill="#fff5f5" stroke="#cbd5e0"/>
    <text x="188" y="95" fill="#c53030">负</text>
    <rect x="102" y="110" width="52" height="40" rx="5" fill="#fff5f5" stroke="#cbd5e0"/>
    <text x="128" y="135" fill="#c53030">负</text>
    <rect x="162" y="110" width="52" height="40" rx="5" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2"/>
    <text x="188" y="135" fill="#2c7a7b" font-weight="bold">正</text>
  </g>
  <text x="128" y="172" font-size="11.5" fill="#c53030" text-anchor="middle">两负得正</text>

  <!-- 配对示意 -->
  <text x="330" y="62" font-size="12.5" fill="#2d3748">三个负因数：(−2)×(−3)×(−4)</text>
  <g font-size="13" fill="#c53030" text-anchor="middle">
    <text x="266" y="94">−</text>
    <text x="316" y="94">−</text>
    <text x="366" y="94">−</text>
  </g>
  <path d="M 254 100 Q 291 128 306 100" fill="none" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="280" y="140" font-size="11.5" fill="#2b6cb0" text-anchor="middle">配成一对 → 正</text>
  <path d="M 354 100 Q 380 128 396 100" fill="none" stroke="#a0aec0" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="392" y="140" font-size="11.5" fill="#718096" text-anchor="middle">落单 → 负</text>

  <rect x="230" y="156" width="200" height="34" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="330" y="178" font-size="13" fill="#c53030" text-anchor="middle">(−2)(−3)(−4) = −24</text>

  <text x="20" y="224" font-size="12" fill="#718096">数一数落单的负号：有则积为负，没有则积为正。若出现因数 0，积直接为 0，符号不必判</text>
  <text x="20" y="242" font-size="12" fill="#718096">除法同理：除以一个数等于乘它的倒数，符号判定完全一致</text>
</svg>
