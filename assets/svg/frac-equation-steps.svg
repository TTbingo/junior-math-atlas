<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 252" width="560" height="252" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="ah2r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="252" fill="#ffffff"/>
  <rect x="1" y="1" width="558" height="250" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="290" y1="10" x2="290" y2="242" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ① 左：解题五步 -->
  <text x="20" y="30" font-size="13.5" font-weight="bold" fill="#2b6cb0">① 解分式方程五步</text>
  <g font-size="11.5" fill="#2d3748">
    <rect x="34" y="44" width="212" height="24" rx="4" fill="#ebf4ff" stroke="#2b6cb0"/>
    <text x="140" y="60" text-anchor="middle">1 分母因式分解，找最简公分母</text>
    <rect x="34" y="80" width="212" height="24" rx="4" fill="#ebf4ff" stroke="#2b6cb0"/>
    <text x="140" y="96" text-anchor="middle">2 两边同乘公分母，逐项都乘</text>
    <rect x="34" y="116" width="212" height="24" rx="4" fill="#ebf4ff" stroke="#2b6cb0"/>
    <text x="140" y="132" text-anchor="middle">3 解整式方程</text>
    <rect x="34" y="152" width="212" height="24" rx="4" fill="#fff5f5" stroke="#c53030"/>
    <text x="140" y="168" text-anchor="middle" fill="#c53030">4 验根：代回各个分母检查</text>
    <rect x="34" y="188" width="212" height="24" rx="4" fill="#ebf4ff" stroke="#2b6cb0"/>
    <text x="140" y="204" text-anchor="middle">5 写结论；全舍则写无解</text>
  </g>
  <line x1="140" y1="68" x2="140" y2="79" stroke="#2b6cb0" stroke-width="1.4" marker-end="url(#ah2)"/>
  <line x1="140" y1="104" x2="140" y2="115" stroke="#2b6cb0" stroke-width="1.4" marker-end="url(#ah2)"/>
  <line x1="140" y1="140" x2="140" y2="151" stroke="#2b6cb0" stroke-width="1.4" marker-end="url(#ah2)"/>
  <line x1="140" y1="176" x2="140" y2="187" stroke="#c53030" stroke-width="1.4" marker-end="url(#ah2r)"/>

  <!-- ② 右：增根示意 -->
  <text x="310" y="30" font-size="13.5" font-weight="bold" fill="#c53030">② 增根：解落进了挖掉的洞</text>
  <text x="310" y="52" font-size="11.5" fill="#2d3748">例：x/(x − 2) − 2 = 2/(x − 2)</text>
  <text x="310" y="74" font-size="11.5" fill="#2d3748">去分母解得 x = 2</text>
  <!-- 数轴 -->
  <line x1="310" y1="104" x2="545" y2="104" stroke="#2d3748" stroke-width="1.5" marker-end="url(#ah2)"/>
  <circle cx="410" cy="104" r="5" fill="#ffffff" stroke="#c53030" stroke-width="2"/>
  <text x="410" y="124" font-size="11.5" fill="#c53030" text-anchor="middle">x = 2（洞）</text>
  <text x="346" y="98" font-size="10.5" fill="#4a5568">0</text>
  <text x="470" y="98" font-size="10.5" fill="#4a5568">3</text>
  <text x="310" y="150" font-size="11.5" fill="#2d3748">代回检验：x − 2 = 0，分母作废</text>
  <text x="310" y="172" font-size="12" fill="#c53030">x = 2 是增根，舍去</text>
  <text x="310" y="198" font-size="11.5" fill="#2d3748">解全被舍掉时，结论写「原方程无解」；</text>
  <text x="310" y="216" font-size="11.5" fill="#4a5568">验根不是可选项，是这一章的第五步。</text>
</svg>
