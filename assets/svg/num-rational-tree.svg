<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" role="img" aria-label="有理数分类树：按定义分为整数与分数，整数下分正整数、零、负整数，分数下分正分数、负分数；按性质分为正有理数、零、负有理数">
  <rect width="540" height="250" fill="#ffffff"/>
  <text x="20" y="24" font-size="13" fill="#2d3748">同一个有理数集合，两把尺子分别量一次，都必须不重不漏</text>

  <!-- 根 -->
  <rect x="214" y="40" width="112" height="30" rx="6" fill="#2b6cb0"/>
  <text x="270" y="60" font-size="14" fill="#ffffff" text-anchor="middle">有理数</text>

  <!-- 左：按定义 -->
  <line x1="240" y1="70" x2="130" y2="94" stroke="#a0aec0" stroke-width="1.5"/>
  <line x1="300" y1="70" x2="410" y2="94" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="120" y="90" font-size="12" fill="#718096" text-anchor="end">按定义分（两支）</text>
  <text x="424" y="90" font-size="12" fill="#718096">按性质分（三支）</text>

  <!-- 左树 -->
  <rect x="44" y="100" width="86" height="26" rx="5" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="87" y="118" font-size="13" fill="#2b6cb0" text-anchor="middle">整数</text>
  <rect x="158" y="100" width="86" height="26" rx="5" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="201" y="118" font-size="13" fill="#2b6cb0" text-anchor="middle">分数</text>

  <g stroke="#a0aec0" stroke-width="1.5">
    <line x1="87" y1="126" x2="87" y2="146"/>
    <line x1="60" y1="146" x2="200" y2="146"/>
    <line x1="40" y1="146" x2="40" y2="160"/>
    <line x1="87" y1="146" x2="87" y2="160"/>
    <line x1="140" y1="146" x2="140" y2="160"/>
  </g>
  <g font-size="12" fill="#2d3748" text-anchor="middle">
    <rect x="12" y="160" width="56" height="22" rx="4" fill="#f7fafc" stroke="#cbd5e0"/>
    <text x="40" y="175">正整数</text>
    <rect x="74" y="160" width="26" height="22" rx="4" fill="#fffaf0" stroke="#dd6b20"/>
    <text x="87" y="175">0</text>
    <rect x="106" y="160" width="68" height="22" rx="4" fill="#f7fafc" stroke="#cbd5e0"/>
    <text x="140" y="175">负整数</text>
  </g>

  <g stroke="#a0aec0" stroke-width="1.5">
    <line x1="201" y1="126" x2="201" y2="146"/>
    <line x1="176" y1="146" x2="228" y2="146"/>
    <line x1="176" y1="146" x2="176" y2="160"/>
    <line x1="228" y1="146" x2="228" y2="160"/>
  </g>
  <g font-size="12" fill="#2d3748" text-anchor="middle">
    <rect x="148" y="160" width="56" height="22" rx="4" fill="#f7fafc" stroke="#cbd5e0"/>
    <text x="176" y="175">正分数</text>
    <rect x="200" y="160" width="56" height="22" rx="4" fill="#f7fafc" stroke="#cbd5e0"/>
    <text x="228" y="175">负分数</text>
  </g>

  <!-- 右树 -->
  <rect x="356" y="100" width="86" height="26" rx="5" fill="#e6fffa" stroke="#2c7a7b" stroke-width="1.5"/>
  <text x="399" y="118" font-size="13" fill="#2c7a7b" text-anchor="middle">正有理数</text>
  <rect x="356" y="146" width="86" height="26" rx="5" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="399" y="164" font-size="13" fill="#dd6b20" text-anchor="middle">0</text>
  <rect x="356" y="192" width="86" height="26" rx="5" fill="#e6fffa" stroke="#2c7a7b" stroke-width="1.5"/>
  <text x="399" y="210" font-size="13" fill="#2c7a7b" text-anchor="middle">负有理数</text>
  <g stroke="#a0aec0" stroke-width="1.5">
    <line x1="440" y1="113" x2="452" y2="113"/>
    <line x1="440" y1="159" x2="452" y2="159"/>
    <line x1="440" y1="205" x2="452" y2="205"/>
  </g>
  <g font-size="11" fill="#718096">
    <text x="458" y="110">正整数</text>
    <text x="458" y="124">正分数</text>
    <text x="458" y="163">既不正也不负</text>
    <text x="458" y="202">负整数</text>
    <text x="458" y="216">负分数</text>
  </g>

  <text x="20" y="238" font-size="11.5" fill="#718096">小数不单独成类：有限小数与无限循环小数都能写成分数，落进「分数」这一支</text>
</svg>
