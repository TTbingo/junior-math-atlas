<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 245" width="560" height="245" role="img" aria-label="三条数轴各标出一个一元二次方程的两个根：第一条两根都在零右侧，第二条两根分居零两侧，第三条两根都在零左侧，右侧文字说明积与和的符号怎样决定两根位置"><rect width="560" height="245" fill="#ffffff"/><text x="70" y="48" font-size="13" fill="#2d3748" text-anchor="start">x² − 5x + 6 = 0</text><line x1="70" y1="70" x2="390" y2="70" stroke="#4a5568" stroke-width="1.5"/><line x1="70" y1="66" x2="70" y2="74" stroke="#4a5568" stroke-width="1.2"/><text x="70" y="88" font-size="11" fill="#4a5568" text-anchor="middle">-4</text><line x1="110" y1="66" x2="110" y2="74" stroke="#4a5568" stroke-width="1.2"/><text x="110" y="88" font-size="11" fill="#4a5568" text-anchor="middle">-3</text><line x1="150" y1="66" x2="150" y2="74" stroke="#4a5568" stroke-width="1.2"/><text x="150" y="88" font-size="11" fill="#4a5568" text-anchor="middle">-2</text><line x1="190" y1="66" x2="190" y2="74" stroke="#4a5568" stroke-width="1.2"/><text x="190" y="88" font-size="11" fill="#4a5568" text-anchor="middle">-1</text><line x1="230" y1="65" x2="230" y2="75" stroke="#4a5568" stroke-width="1.2"/><text x="230" y="88" font-size="11" fill="#4a5568" text-anchor="middle">0</text><line x1="270" y1="66" x2="270" y2="74" stroke="#4a5568" stroke-width="1.2"/><text x="270" y="88" font-size="11" fill="#4a5568" text-anchor="middle">1</text><line x1="310" y1="66" x2="310" y2="74" stroke="#4a5568" stroke-width="1.2"/><text x="310" y="88" font-size="11" fill="#4a5568" text-anchor="middle">2</text><line x1="350" y1="66" x2="350" y2="74" stroke="#4a5568" stroke-width="1.2"/><text x="350" y="88" font-size="11" fill="#4a5568" text-anchor="middle">3</text><line x1="390" y1="66" x2="390" y2="74" stroke="#4a5568" stroke-width="1.2"/><text x="390" y="88" font-size="11" fill="#4a5568" text-anchor="middle">4</text><text x="402" y="66" font-size="12" fill="#2b6cb0" text-anchor="start">x₁x₂ = 6 &gt; 0：同侧</text><text x="402" y="86" font-size="12" fill="#2d3748" text-anchor="start">x₁+x₂ = 5 &gt; 0：同正</text><circle cx="310" cy="70" r="5" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><circle cx="350" cy="70" r="5" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><text x="310" y="58" font-size="12" fill="#2b6cb0" text-anchor="middle">x₁</text><text x="350" y="58" font-size="12" fill="#2b6cb0" text-anchor="middle">x₂</text><text x="70" y="118" font-size="13" fill="#2d3748" text-anchor="start">x² + x − 6 = 0</text><line x1="70" y1="140" x2="390" y2="140" stroke="#4a5568" stroke-width="1.5"/><line x1="70" y1="136" x2="70" y2="144" stroke="#4a5568" stroke-width="1.2"/><text x="70" y="158" font-size="11" fill="#4a5568" text-anchor="middle">-4</text><line x1="110" y1="136" x2="110" y2="144" stroke="#4a5568" stroke-width="1.2"/><text x="110" y="158" font-size="11" fill="#4a5568" text-anchor="middle">-3</text><line x1="150" y1="136" x2="150" y2="144" stroke="#4a5568" stroke-width="1.2"/><text x="150" y="158" font-size="11" fill="#4a5568" text-anchor="middle">-2</text><line x1="190" y1="136" x2="190" y2="144" stroke="#4a5568" stroke-width="1.2"/><text x="190" y="158" font-size="11" fill="#4a5568" text-anchor="middle">-1</text><line x1="230" y1="135" x2="230" y2="145" stroke="#4a5568" stroke-width="1.2"/><text x="230" y="158" font-size="11" fill="#4a5568" text-anchor="middle">0</text><line x1="270" y1="136" x2="270" y2="144" stroke="#4a5568" stroke-width="1.2"/><text x="270" y="158" font-size="11" fill="#4a5568" text-anchor="middle">1</text><line x1="310" y1="136" x2="310" y2="144" stroke="#4a5568" stroke-width="1.2"/><text x="310" y="158" font-size="11" fill="#4a5568" text-anchor="middle">2</text><line x1="350" y1="136" x2="350" y2="144" stroke="#4a5568" stroke-width="1.2"/><text x="350" y="158" font-size="11" fill="#4a5568" text-anchor="middle">3</text><line x1="390" y1="136" x2="390" y2="144" stroke="#4a5568" stroke-width="1.2"/><text x="390" y="158" font-size="11" fill="#4a5568" text-anchor="middle">4</text><text x="402" y="136" font-size="12" fill="#2b6cb0" text-anchor="start">x₁x₂ = −6 &lt; 0：异侧</text><text x="402" y="156" font-size="12" fill="#2d3748" text-anchor="start">一正一负，看和的符号</text><circle cx="110" cy="140" r="5" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><circle cx="310" cy="140" r="5" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><text x="110" y="128" font-size="12" fill="#2b6cb0" text-anchor="middle">x₁</text><text x="310" y="128" font-size="12" fill="#2b6cb0" text-anchor="middle">x₂</text><text x="70" y="188" font-size="13" fill="#2d3748" text-anchor="start">x² + 5x + 6 = 0</text><line x1="70" y1="210" x2="390" y2="210" stroke="#4a5568" stroke-width="1.5"/><line x1="70" y1="206" x2="70" y2="214" stroke="#4a5568" stroke-width="1.2"/><text x="70" y="228" font-size="11" fill="#4a5568" text-anchor="middle">-4</text><line x1="110" y1="206" x2="110" y2="214" stroke="#4a5568" stroke-width="1.2"/><text x="110" y="228" font-size="11" fill="#4a5568" text-anchor="middle">-3</text><line x1="150" y1="206" x2="150" y2="214" stroke="#4a5568" stroke-width="1.2"/><text x="150" y="228" font-size="11" fill="#4a5568" text-anchor="middle">-2</text><line x1="190" y1="206" x2="190" y2="214" stroke="#4a5568" stroke-width="1.2"/><text x="190" y="228" font-size="11" fill="#4a5568" text-anchor="middle">-1</text><line x1="230" y1="205" x2="230" y2="215" stroke="#4a5568" stroke-width="1.2"/><text x="230" y="228" font-size="11" fill="#4a5568" text-anchor="middle">0</text><line x1="270" y1="206" x2="270" y2="214" stroke="#4a5568" stroke-width="1.2"/><text x="270" y="228" font-size="11" fill="#4a5568" text-anchor="middle">1</text><line x1="310" y1="206" x2="310" y2="214" stroke="#4a5568" stroke-width="1.2"/><text x="310" y="228" font-size="11" fill="#4a5568" text-anchor="middle">2</text><line x1="350" y1="206" x2="350" y2="214" stroke="#4a5568" stroke-width="1.2"/><text x="350" y="228" font-size="11" fill="#4a5568" text-anchor="middle">3</text><line x1="390" y1="206" x2="390" y2="214" stroke="#4a5568" stroke-width="1.2"/><text x="390" y="228" font-size="11" fill="#4a5568" text-anchor="middle">4</text><text x="402" y="206" font-size="12" fill="#2b6cb0" text-anchor="start">x₁x₂ = 6 &gt; 0：同侧</text><text x="402" y="226" font-size="12" fill="#2d3748" text-anchor="start">x₁+x₂ = −5 &lt; 0：同负</text><circle cx="110" cy="210" r="5" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><circle cx="150" cy="210" r="5" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><text x="110" y="198" font-size="12" fill="#2b6cb0" text-anchor="middle">x₁</text><text x="150" y="198" font-size="12" fill="#2b6cb0" text-anchor="middle">x₂</text></svg>