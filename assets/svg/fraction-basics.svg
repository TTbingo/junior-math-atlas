<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 252" width="560" height="252" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="252" fill="#ffffff"/>
  <rect x="1" y="1" width="558" height="250" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="290" y1="10" x2="290" y2="242" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ① 左：分式 = 还没算完的除法 -->
  <text x="20" y="30" font-size="13.5" font-weight="bold" fill="#2b6cb0">① 分式 = 还没算完的除法</text>
  <text x="20" y="52" font-size="11.5" fill="#2d3748">约分：分子分母同时拿走相同的一块</text>
  <!-- 6x / 9x^2 -->
  <text x="52" y="92" font-size="16" fill="#2d3748" text-anchor="middle">6x</text>
  <line x1="30" y1="99" x2="74" y2="99" stroke="#2d3748" stroke-width="1.6"/>
  <text x="52" y="119" font-size="16" fill="#2d3748" text-anchor="middle">9x²</text>
  <text x="84" y="108" font-size="13" fill="#2b6cb0">=</text>
  <!-- 2 / 3x -->
  <text x="122" y="92" font-size="16" fill="#2b6cb0" text-anchor="middle">2</text>
  <line x1="106" y1="99" x2="138" y2="99" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="122" y="119" font-size="16" fill="#2b6cb0" text-anchor="middle">3x</text>
  <!-- 同除 3x 标注 -->
  <path d="M 76 86 Q 112 70 146 90" fill="none" stroke="#2b6cb0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="150" y="78" font-size="11" fill="#2b6cb0">同除 3x（3x ≠ 0）</text>
  <text x="20" y="146" font-size="11.5" fill="#4a5568">分数约分拿走公因数，</text>
  <text x="20" y="164" font-size="11.5" fill="#4a5568">分式约分拿走公因式——规矩一样。</text>
  <text x="20" y="192" font-size="11.5" fill="#2d3748">通分：把两个分母换算成</text>
  <text x="20" y="210" font-size="11.5" fill="#2d3748">同一个式子，才能加减。</text>

  <!-- ② 右：分母为零，整个式子作废 -->
  <text x="310" y="30" font-size="13.5" font-weight="bold" fill="#c53030">② 分母为零，式子作废</text>
  <text x="310" y="52" font-size="11.5" fill="#2d3748">1/(x − 2)：数轴上 x = 2 是挖掉的洞</text>
  <!-- 数轴 -->
  <line x1="310" y1="86" x2="545" y2="86" stroke="#2d3748" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="400" cy="86" r="5" fill="#ffffff" stroke="#c53030" stroke-width="2"/>
  <text x="400" y="106" font-size="11.5" fill="#c53030" text-anchor="middle">2（挖掉）</text>
  <text x="336" y="80" font-size="10.5" fill="#4a5568">−1</text>
  <text x="436" y="80" font-size="10.5" fill="#4a5568">3</text>
  <text x="310" y="128" font-size="11.5" fill="#2d3748">所以使用前提：x ≠ 2</text>
  <text x="310" y="158" font-size="11.5" fill="#2d3748">值为零要两个条件同时满足：</text>
  <text x="310" y="178" font-size="11.5" fill="#2b6cb0">分子 = 0 且 分母 ≠ 0</text>
  <text x="310" y="206" font-size="11" fill="#4a5568">只看分子会漏掉分母这半边，</text>
  <text x="310" y="224" font-size="11" fill="#4a5568">那是判断题最爱挖的坑。</text>
</svg>
