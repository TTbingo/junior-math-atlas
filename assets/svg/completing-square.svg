<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="左边 L 形由 x 平方正方形和两条 3x 长条组成缺一角，右边补上 3 乘 3 的角拼成边长 x 加 3 的大正方形，方程由 x 平方加 6x 等于 7 变为 x 加 3 的平方等于 16"><rect width="560" height="300" fill="#ffffff"/><text x="120" y="36" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">x² + 6x：一个缺角的 L 形</text><rect x="40" y="80" width="160" height="160" fill="none" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="40" y="80" width="100" height="100" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="90" y="135" font-size="15" fill="#2b6cb0" text-anchor="middle">x²</text><rect x="140" y="80" width="60" height="100" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/><text x="170" y="135" font-size="13" fill="#b7791f" text-anchor="middle">3x</text><rect x="40" y="180" width="100" height="60" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/><text x="90" y="213" font-size="13" fill="#b7791f" text-anchor="middle">3x</text><rect x="140" y="180" width="60" height="60" fill="none" stroke="#c53030" stroke-width="1.5" stroke-dasharray="4 3"/><text x="170" y="214" font-size="14" fill="#c53030" text-anchor="middle">9</text><text x="90" y="74" font-size="12" fill="#4a5568" text-anchor="middle">x</text><text x="170" y="74" font-size="12" fill="#4a5568" text-anchor="middle">3</text><text x="32" y="134" font-size="12" fill="#4a5568" text-anchor="middle">x</text><text x="32" y="214" font-size="12" fill="#4a5568" text-anchor="middle">3</text><text x="120" y="270" font-size="14" font-weight="600" fill="#c53030" text-anchor="middle">x² + 6x = 7</text><line x1="214" y1="160" x2="308" y2="160" stroke="#c53030" stroke-width="2"/><polygon points="316,160 308.0,164.8 308.0,155.2" fill="#c53030"/><text x="260" y="146" font-size="12" fill="#c53030" text-anchor="middle">补上 9</text><text x="410" y="36" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">补上 9：恰好拼成边长 x + 3</text><rect x="330" y="80" width="160" height="160" fill="none" stroke="#2d3748" stroke-width="2"/><rect x="330" y="80" width="100" height="100" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="380" y="135" font-size="15" fill="#2b6cb0" text-anchor="middle">x²</text><rect x="430" y="80" width="60" height="100" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/><text x="460" y="135" font-size="13" fill="#b7791f" text-anchor="middle">3x</text><rect x="330" y="180" width="100" height="60" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/><text x="380" y="213" font-size="13" fill="#b7791f" text-anchor="middle">3x</text><rect x="430" y="180" width="60" height="60" fill="#f0fff4" stroke="#2f855a" stroke-width="1.5"/><text x="460" y="214" font-size="14" fill="#2f855a" text-anchor="middle">9</text><text x="380" y="74" font-size="12" fill="#4a5568" text-anchor="middle">x</text><text x="460" y="74" font-size="12" fill="#4a5568" text-anchor="middle">3</text><text x="322" y="134" font-size="12" fill="#4a5568" text-anchor="middle">x</text><text x="322" y="214" font-size="12" fill="#4a5568" text-anchor="middle">3</text><text x="410" y="270" font-size="13" font-weight="600" fill="#c53030" text-anchor="middle">(x+3)² = x² + 6x + 9 = 16</text></svg>