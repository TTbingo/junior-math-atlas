<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250">
  <rect width="560" height="250" fill="#ffffff"/>
  <text x="20" y="24" font-size="13" fill="#2d3748">一个函数的三种证件：解析式管算，列表管查，图象管看（s=60t）</text>

  <!-- 左栏：解析式 -->
  <rect x="20" y="40" width="160" height="150" fill="#ebf4ff" stroke="#2b6cb0"/>
  <text x="100" y="62" font-size="12" fill="#2b6cb0" text-anchor="middle">解析式法</text>
  <text x="100" y="90" font-size="14" fill="#2d3748" text-anchor="middle">s = 60t</text>
  <text x="100" y="114" font-size="10.5" fill="#4a5568" text-anchor="middle">能算任意 t 的精确值</text>
  <text x="100" y="132" font-size="10.5" fill="#4a5568" text-anchor="middle">t=3.5 → s=210</text>
  <text x="100" y="150" font-size="10.5" fill="#4a5568" text-anchor="middle">但看不到「长相」</text>
  <text x="100" y="174" font-size="10" fill="#718096" text-anchor="middle">通道：算</text>

  <!-- 中栏：列表 -->
  <rect x="200" y="40" width="160" height="150" fill="#f0fff4" stroke="#38a169"/>
  <text x="280" y="62" font-size="12" fill="#38a169" text-anchor="middle">列表法</text>
  <text x="243" y="86" font-size="11" fill="#2d3748" text-anchor="middle">t</text>
  <text x="316" y="86" font-size="11" fill="#2d3748" text-anchor="middle">s</text>
  <line x1="262" y1="70" x2="262" y2="158" stroke="#38a169"/>
  <line x1="222" y1="92" x2="338" y2="92" stroke="#a7d8b8"/>
  <text x="243" y="110" font-size="11" fill="#2d3748" text-anchor="middle">0</text><text x="316" y="110" font-size="11" fill="#2d3748" text-anchor="middle">0</text>
  <text x="243" y="128" font-size="11" fill="#2d3748" text-anchor="middle">1</text><text x="316" y="128" font-size="11" fill="#2d3748" text-anchor="middle">60</text>
  <text x="243" y="146" font-size="11" fill="#2d3748" text-anchor="middle">2</text><text x="316" y="146" font-size="11" fill="#2d3748" text-anchor="middle">120</text>
  <text x="280" y="178" font-size="10" fill="#718096" text-anchor="middle">通道：查（只有离散点）</text>

  <!-- 右栏：图象 -->
  <rect x="380" y="40" width="160" height="150" fill="#fff5f5" stroke="#c53030"/>
  <text x="460" y="62" font-size="12" fill="#c53030" text-anchor="middle">图象法</text>
  <line x1="405" y1="170" x2="405" y2="80" stroke="#2d3748" stroke-width="1.2"/>
  <line x1="405" y1="170" x2="525" y2="170" stroke="#2d3748" stroke-width="1.2"/>
  <line x1="405" y1="170" x2="520" y2="92" stroke="#c53030" stroke-width="2"/>
  <text x="398" y="80" font-size="10" fill="#2d3748" text-anchor="end">s</text>
  <text x="528" y="180" font-size="10" fill="#2d3748">t</text>
  <text x="452" y="118" font-size="10" fill="#c53030">趋势一眼看穿</text>
  <text x="460" y="178" font-size="10" fill="#718096" text-anchor="middle">通道：看（读数有误差）</text>

  <line x1="20" y1="206" x2="540" y2="206" stroke="#cbd5e0"/>
  <text x="20" y="226" font-size="11.5" fill="#4a5568">描点法是左→右的翻译：取值 → 求值列表 → 描点 → 平滑连线 → 检验</text>
  <text x="20" y="244" font-size="10.5" fill="#718096">三法互译以「对应值吻合」为检验标准</text>
</svg>
