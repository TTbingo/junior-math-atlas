<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="540" height="230" role="img" aria-label="等腰三角形、等边三角形、直角三角形三类特殊三角形及各自的关键性质">
  <rect width="540" height="230" fill="#ffffff"/>
  <!-- 等腰 -->
  <text x="110" y="32" font-size="14" fill="#2d3748" text-anchor="middle">等腰三角形</text>
  <polygon points="50,180 170,180 110,56" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="74" y1="124" x2="86" y2="112" stroke="#c53030" stroke-width="2"/>
  <line x1="134" y1="112" x2="146" y2="124" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="204" font-size="12" fill="#4a5568" text-anchor="middle">两腰相等，两底角相等</text>
  <!-- 等边 -->
  <text x="270" y="32" font-size="14" fill="#2d3748" text-anchor="middle">等边三角形</text>
  <polygon points="220,180 320,180 270,93" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="270" y="204" font-size="12" fill="#4a5568" text-anchor="middle">三边相等，三角都是 60°</text>
  <!-- 直角 -->
  <text x="420" y="32" font-size="14" fill="#2d3748" text-anchor="middle">直角三角形</text>
  <polygon points="380,180 380,90 480,180" fill="#fffaf0" stroke="#b7791f" stroke-width="2"/>
  <polyline points="380,168 392,168 392,180" fill="none" stroke="#b7791f" stroke-width="2"/>
  <text x="430" y="204" font-size="12" fill="#4a5568" text-anchor="middle">a² + b² = c²</text>
</svg>
