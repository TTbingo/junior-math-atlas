<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="上下两架天平：第一架左盘物体加三个砝码对右盘五个砝码，两边同时拿走三个砝码后仍平衡，第二架左盘只剩物体、右盘两个砝码；右侧写出 x 加 3 等于 5 变形到 x 等于 2 的两种记法"><rect width="560" height="300" fill="#ffffff"/><line x1="100" y1="50" x2="240" y2="50" stroke="#2d3748" stroke-width="3"/><line x1="100" y1="50" x2="100" y2="78" stroke="#4a5568" stroke-width="1.2"/><line x1="240" y1="50" x2="240" y2="78" stroke="#4a5568" stroke-width="1.2"/><rect x="62.0" y="78" width="76" height="18" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5" rx="3"/><rect x="202.0" y="78" width="76" height="18" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5" rx="3"/><polygon points="170,52 158,94 182,94" fill="#2d3748"/><line x1="148" y1="94" x2="192" y2="94" stroke="#2d3748" stroke-width="3"/><rect x="70" y="66" width="14" height="12" fill="#fefcbf" stroke="#b7791f" stroke-width="1.8"/><circle cx="96" cy="73.5" r="4.5" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/><circle cx="108" cy="73.5" r="4.5" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/><circle cx="120" cy="73.5" r="4.5" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/><circle cx="216" cy="73.5" r="4.5" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/><circle cx="228" cy="73.5" r="4.5" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/><circle cx="240" cy="73.5" r="4.5" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/><circle cx="252" cy="73.5" r="4.5" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/><circle cx="264" cy="73.5" r="4.5" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/><text x="170" y="124" font-size="15" font-weight="600" fill="#c53030" text-anchor="middle">x + 3 = 5</text><line x1="170" y1="136" x2="170" y2="164" stroke="#2b6cb0" stroke-width="2"/><polygon points="170,172 165.2,164.0 174.8,164.0" fill="#2b6cb0"/><text x="184" y="156" font-size="12" fill="#4a5568" text-anchor="start">两边同拿走 3 个砝码</text><line x1="100" y1="180" x2="240" y2="180" stroke="#2d3748" stroke-width="3"/><line x1="100" y1="180" x2="100" y2="208" stroke="#4a5568" stroke-width="1.2"/><line x1="240" y1="180" x2="240" y2="208" stroke="#4a5568" stroke-width="1.2"/><rect x="62.0" y="208" width="76" height="18" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5" rx="3"/><rect x="202.0" y="208" width="76" height="18" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5" rx="3"/><polygon points="170,182 158,224 182,224" fill="#2d3748"/><line x1="148" y1="224" x2="192" y2="224" stroke="#2d3748" stroke-width="3"/><rect x="70" y="196" width="14" height="12" fill="#fefcbf" stroke="#b7791f" stroke-width="1.8"/><circle cx="232" cy="203.5" r="4.5" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/><circle cx="248" cy="203.5" r="4.5" fill="#a0aec0" stroke="#4a5568" stroke-width="1"/><text x="170" y="254" font-size="15" font-weight="600" fill="#c53030" text-anchor="middle">x = 2</text><rect x="320" y="60" width="215" height="200" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5" rx="8"/><text x="427" y="88" font-size="13" font-weight="600" fill="#2d3748" text-anchor="middle">同一个动作，两种记法</text><text x="427" y="120" font-size="14" font-weight="600" fill="#c53030" text-anchor="middle">x + 3 = 5</text><text x="427" y="146" font-size="12" fill="#4a5568" text-anchor="middle">两边同减 3</text><text x="427" y="172" font-size="13" fill="#2d3748" text-anchor="middle">x = 5 − 3</text><text x="427" y="204" font-size="14" font-weight="600" fill="#c53030" text-anchor="middle">x = 2</text><text x="427" y="234" font-size="12" fill="#4a5568" text-anchor="middle">「移项变号」</text><text x="427" y="250" font-size="12" fill="#4a5568" text-anchor="middle">就是两边同减的速记</text></svg>