<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250">
  <rect width="560" height="250" fill="#ffffff"/>
  <text x="20" y="24" font-size="13" fill="#2d3748">正方体展开图：能折的与不能折的，一眼判生死</text>

  <!-- 左：1-4-1 型 -->
  <text x="20" y="52" font-size="12" fill="#2b6cb0">① 1-4-1 型：能折成</text>
  <rect x="40" y="64" width="34" height="34" fill="#ebf4ff" stroke="#2b6cb0"/>
  <rect x="76" y="64" width="34" height="34" fill="#ebf4ff" stroke="#2b6cb0"/>
  <rect x="112" y="64" width="34" height="34" fill="#ebf4ff" stroke="#2b6cb0"/>
  <rect x="148" y="64" width="34" height="34" fill="#ebf4ff" stroke="#2b6cb0"/>
  <rect x="148" y="28" width="34" height="34" fill="#fefcbf" stroke="#b7791f"/>
  <rect x="126" y="100" width="34" height="34" fill="#fefcbf" stroke="#b7791f"/>
  <text x="57" y="86" font-size="12" fill="#2d3748" text-anchor="middle">A</text>
  <text x="93" y="86" font-size="12" fill="#2d3748" text-anchor="middle">B</text>
  <text x="129" y="86" font-size="12" fill="#2d3748" text-anchor="middle">C</text>
  <text x="165" y="86" font-size="12" fill="#2d3748" text-anchor="middle">D</text>
  <text x="165" y="50" font-size="12" fill="#2d3748" text-anchor="middle">上</text>
  <text x="143" y="122" font-size="12" fill="#2d3748" text-anchor="middle">下</text>
  <text x="20" y="152" font-size="11" fill="#2d3748">相对面：A−C（隔一面）、B−D（隔一面）、上−下</text>
  <text x="20" y="170" font-size="11" fill="#2d3748">三对相对面互不相邻，六面齐整</text>
  <text x="20" y="188" font-size="11" fill="#718096">口诀：同行隔一面，Z 端必相对</text>

  <!-- 右：田字与凹字 -->
  <text x="300" y="52" font-size="12" fill="#c53030">② 含「田」或「凹」—— 必不能折成</text>
  <!-- 田字 -->
  <rect x="310" y="66" width="32" height="32" fill="#fff5f5" stroke="#c53030"/>
  <rect x="344" y="66" width="32" height="32" fill="#fff5f5" stroke="#c53030"/>
  <rect x="310" y="100" width="32" height="32" fill="#fff5f5" stroke="#c53030"/>
  <rect x="344" y="100" width="32" height="32" fill="#fff5f5" stroke="#c53030"/>
  <line x1="310" y1="98" x2="510" y2="98" stroke="#c53030" stroke-width="2"/>
  <text x="398" y="88" font-size="26" fill="#c53030" text-anchor="middle">×</text>
  <text x="310" y="152" font-size="10.5" fill="#c53030">田字：折起后两块抢同一面</text>
  <!-- 凹字 -->
  <rect x="430" y="66" width="26" height="26" fill="#fff5f5" stroke="#c53030"/>
  <rect x="458" y="66" width="26" height="26" fill="#fff5f5" stroke="#c53030"/>
  <rect x="486" y="66" width="26" height="26" fill="#fff5f5" stroke="#c53030"/>
  <rect x="458" y="94" width="26" height="26" fill="#fff5f5" stroke="#c53030"/>
  <rect x="458" y="122" width="26" height="26" fill="#fff5f5" stroke="#c53030"/>
  <line x1="424" y1="128" x2="510" y2="128" stroke="#c53030" stroke-width="2"/>
  <text x="467" y="112" font-size="24" fill="#c53030" text-anchor="middle">×</text>
  <text x="430" y="168" font-size="10.5" fill="#c53030">凹字：上下两块折向冲突</text>

  <line x1="20" y1="192" x2="540" y2="192" stroke="#cbd5e0"/>
  <text x="20" y="214" font-size="11.5" fill="#4a5568">11 种合法展开图按行数记：1-4-1 有 6 种、2-3-1 有 3 种、2-2-2 阶梯 1 种、3-3 错半格 1 种</text>
  <text x="20" y="236" font-size="11" fill="#718096">铁律：相对面在展开图中必不相邻（有公共边折后必相邻）</text>
</svg>
