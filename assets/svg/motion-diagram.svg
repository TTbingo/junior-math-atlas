<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="上下两幅线段图：上幅 A、B 两地相距 60 千米两人相向而行中途相遇，两段路程相加等于全程；下幅两条车道，乙在前领先一段距离，甲在后追到同一终点，甲走的路程等于乙走的路程加领先的差距"><rect width="560" height="300" fill="#ffffff"/><text x="280" y="28" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">相遇：两人走的路程之和 = 全程</text><circle cx="70" cy="75" r="4.5" fill="#2d3748" stroke="#2d3748" stroke-width="1"/><text x="70" y="60" font-size="12" fill="#2d3748" text-anchor="middle">A</text><circle cx="510" cy="75" r="4.5" fill="#2d3748" stroke="#2d3748" stroke-width="1"/><text x="510" y="60" font-size="12" fill="#2d3748" text-anchor="middle">B</text><circle cx="310" cy="75" r="4.5" fill="#c53030" stroke="#c53030" stroke-width="1"/><text x="310" y="60" font-size="12" fill="#c53030" text-anchor="middle">相遇点</text><line x1="78" y1="75" x2="296" y2="75" stroke="#2b6cb0" stroke-width="2.5"/><polygon points="302,75 294.0,79.8 294.0,70.2" fill="#2b6cb0"/><text x="185" y="57" font-size="12" fill="#2b6cb0" text-anchor="middle">甲：2(x+10) 千米</text><line x1="502" y1="75" x2="324" y2="75" stroke="#2f855a" stroke-width="2.5"/><polygon points="318,75 326.0,70.2 326.0,79.8" fill="#2f855a"/><text x="415" y="57" font-size="12" fill="#2f855a" text-anchor="middle">乙：2x 千米</text><line x1="70" y1="95" x2="510" y2="95" stroke="#4a5568" stroke-width="1"/><line x1="70" y1="89" x2="70" y2="101" stroke="#4a5568" stroke-width="1"/><line x1="510" y1="89" x2="510" y2="101" stroke="#4a5568" stroke-width="1"/><text x="280" y="113" font-size="12" fill="#4a5568" text-anchor="middle">全程 60 千米</text><text x="280" y="140" font-size="13" font-weight="600" fill="#c53030" text-anchor="middle">2(x+10) + 2x = 60</text><text x="280" y="172" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">追及：快者多走的路 = 原来领先的差距</text><line x1="446" y1="190" x2="446" y2="248" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="3 3"/><text x="452" y="184" font-size="12" fill="#c53030" text-anchor="middle">追上点</text><circle cx="250" cy="202" r="4.5" fill="#2f855a" stroke="#2f855a" stroke-width="1"/><text x="250" y="191" font-size="12" fill="#2f855a" text-anchor="middle">乙</text><line x1="258" y1="202" x2="430" y2="202" stroke="#2f855a" stroke-width="2.5"/><polygon points="438,202 430.0,206.8 430.0,197.2" fill="#2f855a"/><text x="350" y="192" font-size="12" fill="#2f855a" text-anchor="middle">乙：v₂t</text><circle cx="70" cy="238" r="4.5" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><text x="70" y="227" font-size="12" fill="#2b6cb0" text-anchor="middle">甲</text><line x1="78" y1="238" x2="430" y2="238" stroke="#2b6cb0" stroke-width="2.5"/><polygon points="438,238 430.0,242.8 430.0,233.2" fill="#2b6cb0"/><text x="300" y="228" font-size="12" fill="#2b6cb0" text-anchor="middle">甲：v₁t</text><line x1="70" y1="258" x2="250" y2="258" stroke="#4a5568" stroke-width="1"/><line x1="70" y1="252" x2="70" y2="264" stroke="#4a5568" stroke-width="1"/><line x1="250" y1="252" x2="250" y2="264" stroke="#4a5568" stroke-width="1"/><text x="160" y="276" font-size="12" fill="#4a5568" text-anchor="middle">乙领先 s₀</text><text x="450" y="276" font-size="13" font-weight="600" fill="#c53030" text-anchor="middle">v₁t = s₀ + v₂t</text></svg>