<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="左图两个全等三角形用相同字母标出对应边，右图把中线 AD 延长一倍到 E 并连接 BE 构造全等三角形">
  <rect width="760" height="360" fill="#ffffff"/>
  <line x1="392" y1="40" x2="392" y2="330" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 左：全等的含义 -->
  <text x="196" y="32" font-size="14" fill="#2d3748" text-anchor="middle">全等：对应边、对应角都相等</text>

  <polygon points="105,80 45,200 195,200" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="105" y="68" font-size="13" fill="#2b6cb0" text-anchor="middle">A</text>
  <text x="38" y="216" font-size="13" fill="#2b6cb0" text-anchor="end">B</text>
  <text x="203" y="216" font-size="13" fill="#2b6cb0">C</text>
  <text x="62" y="136" font-size="13" fill="#2b6cb0" text-anchor="end">c</text>
  <text x="160" y="136" font-size="13" fill="#2b6cb0">b</text>
  <text x="120" y="218" font-size="13" fill="#2b6cb0" text-anchor="middle">a</text>

  <polygon points="300,80 240,200 390,200" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="300" y="68" font-size="13" fill="#2b6cb0" text-anchor="middle">A′</text>
  <text x="246" y="218" font-size="13" fill="#2b6cb0">B′</text>
  <text x="398" y="216" font-size="13" fill="#2b6cb0">C′</text>
  <text x="257" y="136" font-size="13" fill="#2b6cb0" text-anchor="end">c</text>
  <text x="355" y="136" font-size="13" fill="#2b6cb0">b</text>
  <text x="315" y="218" font-size="13" fill="#2b6cb0" text-anchor="middle">a</text>

  <g font-size="12" fill="#4a5568">
    <text x="196" y="250" text-anchor="middle">对应边标同一个字母，长度就相等</text>
    <text x="196" y="270" text-anchor="middle">∠A = ∠A′，∠B = ∠B′，∠C = ∠C′</text>
    <text x="196" y="292" text-anchor="middle" fill="#c53030">写全等时字母顺序要对齐：△ABC ≌ △A′B′C′</text>
    <text x="196" y="316" text-anchor="middle" fill="#718096">三个角相等（AAA）不算全等，大小可以不同</text>
  </g>

  <!-- 右：倍长中线 -->
  <text x="580" y="32" font-size="14" fill="#2d3748" text-anchor="middle">倍长中线：把 AC 搬到 BE 边上</text>

  <polygon points="585,55 500,175 670,175" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <line x1="585" y1="55" x2="585" y2="295" stroke="#2f855a" stroke-width="2"/>
  <line x1="585" y1="175" x2="585" y2="295" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="500" y1="175" x2="585" y2="295" stroke="#c53030" stroke-width="2"/>

  <text x="585" y="46" font-size="13" fill="#2f855a" text-anchor="middle">A</text>
  <text x="492" y="180" font-size="13" fill="#2f855a" text-anchor="end">B</text>
  <text x="678" y="180" font-size="13" fill="#2f855a">C</text>
  <text x="594" y="180" font-size="13" fill="#2f855a">D</text>
  <text x="594" y="308" font-size="13" fill="#c53030">E</text>

  <!-- 等长标记 -->
  <g stroke="#2f855a" stroke-width="1.8">
    <line x1="577" y1="115" x2="593" y2="115"/>
    <line x1="577" y1="235" x2="593" y2="235"/>
    <line x1="538" y1="169" x2="538" y2="181"/>
    <line x1="546" y1="169" x2="546" y2="181"/>
    <line x1="623" y1="169" x2="623" y2="181"/>
    <line x1="631" y1="169" x2="631" y2="181"/>
  </g>

  <g font-size="12" fill="#4a5568">
    <text x="580" y="330" font-size="11" text-anchor="middle">AD=DE，∠ADC=∠EDB，DC=DB</text>
    <text x="580" y="346" font-size="11" text-anchor="middle" fill="#c53030">△ADC≌△EDB（SAS）→ AC=BE，AB+BE &gt; 2AD</text>
  </g>
</svg>
