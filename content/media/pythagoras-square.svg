" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">b</text><text x="256.0" y="226.0" font-size="13" fill="#1f2937" text-anchor="end" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">a</text><text x="504.0" y="98.0" font-size="13" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">a</text><text x="504.0" y="210.0" font-size="13" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">b</text><text x="332.0" y="294.0" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">b</text><text x="444.0" y="294.0" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">a</text><text x="410.0" y="128.0" font-size="13" fill="#dc2626" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">c</text><text x="380.0" y="168.0" font-size="16" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">c²</text><text x="30.0" y="110.0" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">(a+b)² = 4×½ab + c²</text><text x="30.0" y="140.0" font-size="12" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">展开：a²+2ab+b² = 2ab+c²</text><text x="30.0" y="170.0" font-size="14" fill="#dc2626" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">得 a²+b² = c²</text><text x="30.0" y="210.0" font-size="12" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">大正方形边长 a+b；</text><text x="30.0" y="232.0" font-size="12" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">四个三角形全等；</text><text x="30.0" y="254.0" font-size="12" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">中间是边长 c 的正方形。</text></svg>