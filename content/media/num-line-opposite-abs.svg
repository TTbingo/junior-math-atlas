<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="540" height="240" role="img" aria-label="数轴上标出负三点五与正三点五，两点分别用虚线连到原点，两段长度相等，说明它们互为相反数且绝对值相等">
  <rect width="540" height="240" fill="#ffffff"/>
  <text x="20" y="26" font-size="13" fill="#2d3748">互为相反数 = 关于原点对称；绝对值 = 到原点的距离</text>

  <!-- 数轴 -->
  <line x1="34" y1="168" x2="508" y2="168" stroke="#4a5568" stroke-width="2"/>
  <polygon points="508,168 494,162 494,174" fill="#4a5568"/>
  <text x="512" y="172" font-size="13" fill="#4a5568">x</text>

  <g stroke="#4a5568" stroke-width="2">
    <line x1="110" y1="162" x2="110" y2="174"/>
    <line x1="430" y1="162" x2="430" y2="174"/>
    <line x1="270" y1="158" x2="270" y2="178"/>
    <line x1="190" y1="162" x2="190" y2="174"/>
    <line x1="350" y1="162" x2="350" y2="174"/>
  </g>
  <g font-size="13" fill="#2d3748" text-anchor="middle">
    <text x="270" y="196">0</text>
    <text x="190" y="196" fill="#a0aec0">−1</text>
    <text x="350" y="196" fill="#a0aec0">1</text>
  </g>

  <!-- 两点 -->
  <circle cx="110" cy="168" r="5" fill="#c53030"/>
  <circle cx="430" cy="168" r="5" fill="#2b6cb0"/>
  <text x="110" y="214" font-size="13" fill="#c53030" text-anchor="middle">−3.5</text>
  <text x="430" y="214" font-size="13" fill="#2b6cb0" text-anchor="middle">+3.5</text>

  <!-- 距离虚线 -->
  <g stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="110" y1="168" x2="110" y2="76" stroke="#c53030"/>
    <line x1="430" y1="168" x2="430" y2="76" stroke="#2b6cb0"/>
  </g>
  <line x1="110" y1="76" x2="430" y2="76" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="270" y="68" font-size="12.5" fill="#4a5568" text-anchor="middle">|−3.5| = |3.5| = 3.5，两段距离一样长</text>
  <text x="270" y="52" font-size="12" fill="#718096" text-anchor="middle">关于原点对称的两个点，到原点的距离必然相等</text>

  <!-- 对称弧 -->
  <path d="M 118 148 A 34 34 0 0 1 262 148" fill="none" stroke="#718096" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M 422 148 A 34 34 0 0 0 278 148" fill="none" stroke="#718096" stroke-width="1.2" stroke-dasharray="3 3"/>
</svg>
