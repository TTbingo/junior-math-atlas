<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" role="img" aria-label="三角形ABC中D为BC中点，延长中线AD到E使DE等于AD，连接BE后得到一对全等三角形">
  <rect width="520" height="360" fill="#ffffff"/>
  <text x="24" y="30" font-size="14" fill="#2d3748">延长中线 AD 到 E，使 DE = AD，连接 BE</text>
  <!-- 三角形 ABC -->
  <polygon points="140,70 70,190 330,190" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <!-- 中线 AD 与延长段 DE -->
  <line x1="140" y1="70" x2="200" y2="190" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="200" y1="190" x2="260" y2="310" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- BE -->
  <line x1="70" y1="190" x2="260" y2="310" stroke="#2f855a" stroke-width="2"/>
  <!-- BD = DC 标记 -->
  <line x1="131" y1="182" x2="139" y2="198" stroke="#4a5568" stroke-width="2"/>
  <line x1="261" y1="182" x2="269" y2="198" stroke="#4a5568" stroke-width="2"/>
  <!-- AD = DE 标记 -->
  <line x1="160" y1="122" x2="170" y2="114" stroke="#c53030" stroke-width="2"/>
  <line x1="232" y1="256" x2="242" y2="248" stroke="#c53030" stroke-width="2"/>
  <!-- 顶点标签 -->
  <g font-size="15" fill="#2d3748">
    <text x="142" y="60">A</text>
    <text x="52" y="188">B</text>
    <text x="338" y="194">C</text>
    <text x="180" y="208">D</text>
    <text x="270" y="326">E</text>
  </g>
  <text x="24" y="348" font-size="13" fill="#718096">由 SAS 得 △BDE ≌ △CDA，于是 BE = AC</text>
</svg>
