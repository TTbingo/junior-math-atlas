<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="左图是三乘三表格列出两次摸球的所有结果并划掉同球重复的三格，右图是三层树状图列出六个末端结果">
  <rect width="760" height="330" fill="#ffffff"/>
  <line x1="400" y1="44" x2="400" y2="300" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 左：表格法 -->
  <text x="180" y="30" font-size="14" fill="#2d3748" text-anchor="middle">表格法：格子总数就是结果总数</text>

  <!-- 列头 -->
  <g font-size="11" fill="#4a5568" text-anchor="middle">
    <text x="128" y="72">红 1</text>
    <text x="184" y="72">红 2</text>
    <text x="240" y="72">白</text>
    <text x="72" y="104">红 1</text>
    <text x="72" y="136">红 2</text>
    <text x="72" y="168">白</text>
  </g>
  <text x="72" y="56" font-size="10" fill="#a0aec0" text-anchor="middle">第一次 ↓</text>

  <!-- 9 格 -->
  <g stroke="#cbd5e0" stroke-width="1" fill="none">
    <rect x="100" y="84" width="56" height="32"/>
    <rect x="156" y="84" width="56" height="32"/>
    <rect x="212" y="84" width="56" height="32"/>
    <rect x="100" y="116" width="56" height="32"/>
    <rect x="156" y="116" width="56" height="32"/>
    <rect x="212" y="116" width="56" height="32"/>
    <rect x="100" y="148" width="56" height="32"/>
    <rect x="156" y="148" width="56" height="32"/>
    <rect x="212" y="148" width="56" height="32"/>
  </g>

  <!-- 同球重复：划掉 -->
  <g stroke="#a0aec0" stroke-width="1.5">
    <line x1="104" y1="88" x2="152" y2="112"/>
    <line x1="152" y1="88" x2="104" y2="112"/>
    <line x1="160" y1="120" x2="208" y2="144"/>
    <line x1="208" y1="120" x2="160" y2="144"/>
    <line x1="216" y1="152" x2="264" y2="176"/>
    <line x1="264" y1="152" x2="216" y2="176"/>
  </g>

  <!-- 目标格 -->
  <rect x="156" y="84" width="56" height="32" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="184" y="104" font-size="10" fill="#c53030" text-anchor="middle">红 1 红 2</text>
  <rect x="100" y="116" width="56" height="32" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="128" y="136" font-size="10" fill="#c53030" text-anchor="middle">红 2 红 1</text>

  <g font-size="12" fill="#4a5568">
    <text x="180" y="210" text-anchor="middle">3 × 3 = 9 格，划掉 3 格「同一个球摸两次」</text>
    <text x="180" y="230" text-anchor="middle">剩下 6 种等可能结果，其中 2 种两次都红</text>
    <text x="180" y="254" text-anchor="middle" fill="#c53030">P = 2 / 6 = 1 / 3</text>
    <text x="180" y="278" text-anchor="middle" fill="#718096">不放回：第二次的可选数比第一次少 1</text>
  </g>

  <!-- 右：树状图 -->
  <text x="580" y="30" font-size="14" fill="#2d3748" text-anchor="middle">树状图：末端枝条数就是结果总数</text>

  <g stroke="#4a5568" stroke-width="1.4" fill="none">
    <path d="M 470 165 L 528 88"/>
    <path d="M 470 165 L 528 165"/>
    <path d="M 470 165 L 528 242"/>
    <path d="M 528 88 L 600 66"/>
    <path d="M 528 88 L 600 110"/>
    <path d="M 528 165 L 600 143"/>
    <path d="M 528 165 L 600 187"/>
    <path d="M 528 242 L 600 220"/>
    <path d="M 528 242 L 600 264"/>
  </g>
  <circle cx="470" cy="165" r="3" fill="#4a5568"/>
  <g fill="#ffffff" stroke="#4a5568" stroke-width="1.4">
    <circle cx="528" cy="88" r="3"/>
    <circle cx="528" cy="165" r="3"/>
    <circle cx="528" cy="242" r="3"/>
  </g>

  <g font-size="11" fill="#2d3748">
    <text x="518" y="92" text-anchor="end">红 1</text>
    <text x="518" y="169" text-anchor="end">红 2</text>
    <text x="518" y="246" text-anchor="end">白</text>
  </g>
  <g font-size="11" fill="#4a5568">
    <text x="608" y="70">红 2</text>
    <text x="608" y="114">白</text>
    <text x="608" y="147">红 1</text>
    <text x="608" y="191">白</text>
    <text x="608" y="224">红 1</text>
    <text x="608" y="268">红 2</text>
  </g>

  <g font-size="11" fill="#c53030">
    <text x="646" y="70">← 两次都红</text>
    <text x="646" y="147">← 两次都红</text>
  </g>
  <g font-size="12" fill="#4a5568">
    <text x="580" y="300" text-anchor="middle">6 条末端，与表格的 6 格一一对应</text>
  </g>
</svg>
