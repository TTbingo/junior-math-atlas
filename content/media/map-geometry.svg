<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-label="几何领域知识脉络：图形的初步认识、三角形、四边形、圆、相似与投影、图形与变换、锐角三角函数七个主题">
  <rect width="760" height="480" fill="#ffffff"/>
  <text x="15" y="34" font-size="14" fill="#4a5568">七个主题分两排：上排从「看图」走到「圆形」，下排把图形搬到变化与测量里用</text>

  <!-- 第一排 -->
  <g>
    <rect x="15" y="70" width="160" height="150" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="1.6"/>
    <text x="31" y="96" font-size="16" fill="#2f855a">图形的初步认识</text>
    <text x="31" y="113" font-size="11" fill="#4a5568">几何的字母表</text>
    <line x1="31" y1="122" x2="159" y2="122" stroke="#c6f6d5" stroke-width="1"/>
    <g font-size="12.5" fill="#2d3748">
      <text x="31" y="144">直线、射线、线段</text>
      <text x="31" y="166">角与角平分线</text>
      <text x="31" y="188">相交线与平行线</text>
    </g>
  </g>
  <g>
    <rect x="205" y="70" width="160" height="150" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="1.6"/>
    <text x="221" y="96" font-size="16" fill="#2f855a">三角形</text>
    <text x="221" y="113" font-size="11" fill="#4a5568">全部推理的主战场</text>
    <line x1="221" y1="122" x2="349" y2="122" stroke="#c6f6d5" stroke-width="1"/>
    <g font-size="12.5" fill="#2d3748">
      <text x="221" y="144">三角形的基本性质</text>
      <text x="221" y="166">全等三角形</text>
      <text x="221" y="188">等腰三角形与等边三角形</text>
      <text x="221" y="210">直角三角形与勾股定理</text>
    </g>
  </g>
  <g>
    <rect x="395" y="70" width="160" height="150" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="1.6"/>
    <text x="411" y="96" font-size="16" fill="#2f855a">四边形</text>
    <text x="411" y="113" font-size="11" fill="#4a5568">靠对角线拆成三角形</text>
    <line x1="411" y1="122" x2="539" y2="122" stroke="#c6f6d5" stroke-width="1"/>
    <g font-size="12.5" fill="#2d3748">
      <text x="411" y="144">多边形与内角和</text>
      <text x="411" y="166">平行四边形</text>
      <text x="411" y="188">矩形、菱形、正方形</text>
      <text x="411" y="210">梯形与中位线</text>
    </g>
  </g>
  <g>
    <rect x="585" y="70" width="160" height="150" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="1.6"/>
    <text x="601" y="96" font-size="16" fill="#2f855a">圆</text>
    <text x="601" y="113" font-size="11" fill="#4a5568">半径、弦、圆心角</text>
    <line x1="601" y1="122" x2="729" y2="122" stroke="#c6f6d5" stroke-width="1"/>
    <g font-size="12.5" fill="#2d3748">
      <text x="601" y="144">圆的概念与性质</text>
      <text x="601" y="166">与圆有关的位置关系</text>
      <text x="601" y="188">弧长、扇形面积与圆锥</text>
      <text x="601" y="210">正多边形与圆</text>
    </g>
  </g>

  <!-- 第一排箭头 -->
  <g stroke="#2f855a" stroke-width="1.6" fill="#2f855a">
    <line x1="177" y1="145" x2="197" y2="145"/><polygon points="205,145 195,140 195,150"/>
    <line x1="367" y1="145" x2="387" y2="145"/><polygon points="395,145 385,140 385,150"/>
    <line x1="557" y1="145" x2="577" y2="145"/><polygon points="585,145 575,140 575,150"/>
  </g>

  <!-- 折线：圆 → 相似与投影 -->
  <path d="M 665 222 L 665 246 L 190 246 L 190 260" fill="none" stroke="#2f855a" stroke-width="1.6"/>
  <polygon points="190,270 185,260 195,260" fill="#2f855a"/>

  <!-- 第二排 -->
  <g>
    <rect x="110" y="270" width="160" height="140" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="1.6"/>
    <text x="126" y="296" font-size="16" fill="#2f855a">相似与投影</text>
    <text x="126" y="313" font-size="11" fill="#4a5568">形状不变，大小可变</text>
    <line x1="126" y1="322" x2="254" y2="322" stroke="#c6f6d5" stroke-width="1"/>
    <g font-size="12.5" fill="#2d3748">
      <text x="126" y="344">相似三角形</text>
      <text x="126" y="366">位似</text>
      <text x="126" y="388">投影与视图</text>
    </g>
  </g>
  <g>
    <rect x="300" y="270" width="160" height="140" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="1.6"/>
    <text x="316" y="296" font-size="16" fill="#2f855a">图形与变换</text>
    <text x="316" y="313" font-size="11" fill="#4a5568">把分散条件搬到一起</text>
    <line x1="316" y1="322" x2="444" y2="322" stroke="#c6f6d5" stroke-width="1"/>
    <g font-size="12.5" fill="#2d3748">
      <text x="316" y="344">轴对称与中心对称</text>
      <text x="316" y="366">平移与旋转</text>
      <text x="316" y="388">变换与坐标</text>
    </g>
  </g>
  <g>
    <rect x="490" y="270" width="160" height="140" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="1.6"/>
    <text x="506" y="296" font-size="16" fill="#2f855a">锐角三角函数</text>
    <text x="506" y="313" font-size="11" fill="#4a5568">把边和角连成比例</text>
    <line x1="506" y1="322" x2="634" y2="322" stroke="#c6f6d5" stroke-width="1"/>
    <g font-size="12.5" fill="#2d3748">
      <text x="506" y="344">锐角三角函数</text>
      <text x="506" y="366">解直角三角形</text>
    </g>
  </g>

  <!-- 第二排箭头 -->
  <g stroke="#2f855a" stroke-width="1.6" fill="#2f855a">
    <line x1="272" y1="340" x2="292" y2="340"/><polygon points="300,340 290,335 290,345"/>
    <line x1="462" y1="340" x2="482" y2="340"/><polygon points="490,340 480,335 480,345"/>
  </g>

  <text x="15" y="442" font-size="13" fill="#718096">主线：先认清线与角，再进三角形做推理，四边形和圆都靠三角形处理，最后用相似、变换、三角函数去解决测量与证明。</text>
  <text x="15" y="464" font-size="12" fill="#a0aec0">脉络依据《初中数学思维导图》第四至十章整理</text>
</svg>
