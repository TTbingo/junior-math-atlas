<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250">
  <rect width="560" height="250" fill="#ffffff"/>
  <text x="20" y="24" font-size="13" fill="#2d3748">三个四分位数把数据四等分，五个数画成一张箱线图</text>

  <!-- 左：切分示意 -->
  <text x="20" y="52" font-size="12" fill="#2b6cb0">切三刀：约每段四分之一的数据</text>
  <line x1="40" y1="120" x2="250" y2="120" stroke="#2d3748" stroke-width="1.2"/>
  <circle cx="50" cy="120" r="3.5" fill="#2d3748"/>
  <circle cx="80" cy="120" r="3.5" fill="#2d3748"/>
  <circle cx="110" cy="120" r="3.5" fill="#2d3748"/>
  <circle cx="130" cy="120" r="3.5" fill="#2d3748"/>
  <circle cx="150" cy="120" r="3.5" fill="#2d3748"/>
  <circle cx="170" cy="120" r="3.5" fill="#2d3748"/>
  <circle cx="195" cy="120" r="3.5" fill="#2d3748"/>
  <circle cx="222" cy="120" r="3.5" fill="#2d3748"/>
  <circle cx="238" cy="120" r="3.5" fill="#2d3748"/>
  <line x1="110" y1="70" x2="110" y2="140" stroke="#2b6cb0" stroke-width="1.5"/>
  <line x1="160" y1="70" x2="160" y2="140" stroke="#2b6cb0" stroke-width="1.5"/>
  <line x1="212" y1="70" x2="212" y2="140" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="110" y="60" font-size="11" fill="#2b6cb0" text-anchor="middle">Q₁</text>
  <text x="160" y="60" font-size="11" fill="#2b6cb0" text-anchor="middle">Q₂</text>
  <text x="212" y="60" font-size="11" fill="#2b6cb0" text-anchor="middle">Q₃</text>
  <text x="52" y="158" font-size="10" fill="#718096" text-anchor="middle">¼</text>
  <text x="135" y="158" font-size="10" fill="#718096" text-anchor="middle">¼</text>
  <text x="186" y="158" font-size="10" fill="#718096" text-anchor="middle">¼</text>
  <text x="232" y="158" font-size="10" fill="#718096" text-anchor="middle">¼</text>
  <text x="20" y="184" font-size="11" fill="#4a5568">Q₂ 就是中位数；</text>
  <text x="20" y="202" font-size="11" fill="#4a5568">IQR = Q₃ − Q₁（中间一半的宽度）</text>
  <text x="20" y="220" font-size="11" fill="#718096">奇数个数据时中位数不归入任何一段</text>

  <!-- 右：箱线图 -->
  <text x="300" y="52" font-size="12" fill="#c53030">箱线图：五数概括一图看完</text>
  <line x1="310" y1="140" x2="540" y2="140" stroke="#2d3748" stroke-width="1.2"/>
  <!-- 须线 -->
  <line x1="325" y1="105" x2="365" y2="105" stroke="#2d3748" stroke-width="1.5"/>
  <line x1="475" y1="105" x2="525" y2="105" stroke="#2d3748" stroke-width="1.5"/>
  <line x1="325" y1="92" x2="325" y2="118" stroke="#2d3748"/>
  <line x1="525" y1="92" x2="525" y2="118" stroke="#2d3748"/>
  <!-- 箱体 -->
  <rect x="365" y="85" width="110" height="40" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <line x1="405" y1="85" x2="405" y2="125" stroke="#c53030" stroke-width="2"/>
  <text x="325" y="80" font-size="10" fill="#2d3748" text-anchor="middle">最小值</text>
  <text x="365" y="140" font-size="10" fill="#2b6cb0" text-anchor="middle">Q₁</text>
  <text x="405" y="80" font-size="10" fill="#c53030" text-anchor="middle">中位数</text>
  <text x="475" y="140" font-size="10" fill="#2b6cb0" text-anchor="middle">Q₃</text>
  <text x="525" y="80" font-size="10" fill="#2d3748" text-anchor="middle">最大值</text>
  <text x="420" y="106" font-size="10.5" fill="#4a5568" text-anchor="middle">箱长 = IQR</text>

  <text x="300" y="172" font-size="11" fill="#4a5568">读图四查：中位数看水平、箱长看波动、</text>
  <text x="300" y="190" font-size="11" fill="#4a5568">须线看拖尾、多图并排看对比</text>
  <text x="300" y="212" font-size="11" fill="#718096">箱线图不显示平均数，也无法反推平均数</text>
</svg>
