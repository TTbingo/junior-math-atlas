<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330"><rect width="740" height="330" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">三类事件与概率这把尺子</text><polygon points="45.0,70.0 255.0,70.0 255.0,190.0 45.0,190.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8" stroke-linejoin="round"/><text x="150.0" y="96.0" font-size="13" fill="#16a34a" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">必然事件</text><text x="150.0" y="126.0" font-size="11" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">太阳从东方升起</text><text x="150.0" y="168.0" font-size="14" fill="#16a34a" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">P = 1</text><polygon points="265.0,70.0 475.0,70.0 475.0,190.0 265.0,190.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round"/><text x="370.0" y="96.0" font-size="13" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">不可能事件</text><text x="370.0" y="126.0" font-size="11" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">石头从天上掉下来</text><text x="370.0" y="168.0" font-size="14" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">P = 0</text><polygon points="485.0,70.0 695.0,70.0 695.0,190.0 485.0,190.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round"/><text x="590.0" y="96.0" font-size="13" fill="#2563eb" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">随机事件</text><text x="590.0" y="126.0" font-size="11" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">掷一枚骰子的点数</text><text x="590.0" y="168.0" font-size="14" fill="#2563eb" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">0 &lt; P &lt; 1</text><text x="370.0" y="226.0" font-size="12" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">概率：可能性大小的刻度</text><line x1="90.0" y1="262.0" x2="650.0" y2="262.0" stroke="#1f2937" stroke-width="3.0" stroke-linecap="round"/><line x1="90.0" y1="254.0" x2="90.0" y2="270.0" stroke="#1f2937" stroke-width="2.0" stroke-linecap="round"/><line x1="650.0" y1="254.0" x2="650.0" y2="270.0" stroke="#1f2937" stroke-width="2.0" stroke-linecap="round"/><text x="90.0" y="288.0" font-size="11" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">0 · 一定不会发生</text><text x="650.0" y="288.0" font-size="11" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">1 · 一定会发生</text><line x1="325.2" y1="236.0" x2="325.2" y2="270.0" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/><text x="325.2" y="226.0" font-size="13" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">P(A)</text><text x="370.0" y="310.0" font-size="11" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">前提：结果总数有限，且每种结果出现的机会均等</text></svg>