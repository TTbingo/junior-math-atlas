<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 215" width="560" height="215" role="img" aria-label="一条 0 到 6 的数轴：上方从 4 到 6 画粗线段表示解集，下方一行圆点中 4、5、6 为实心红点表示可行方案，0 到 3 为空心灰点不可行"><rect width="560" height="215" fill="#ffffff"/><text x="295" y="26" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">解集是一整段，可行的只有整数点</text><text x="468" y="78" font-size="12" fill="#4a5568" text-anchor="start">x（大巴数）</text><line x1="130" y1="95" x2="460" y2="95" stroke="#4a5568" stroke-width="1.5"/><line x1="130" y1="91" x2="130" y2="99" stroke="#4a5568" stroke-width="1.2"/><text x="130" y="113" font-size="11" fill="#4a5568" text-anchor="middle">0</text><line x1="185" y1="91" x2="185" y2="99" stroke="#4a5568" stroke-width="1.2"/><text x="185" y="113" font-size="11" fill="#4a5568" text-anchor="middle">1</text><line x1="240" y1="91" x2="240" y2="99" stroke="#4a5568" stroke-width="1.2"/><text x="240" y="113" font-size="11" fill="#4a5568" text-anchor="middle">2</text><line x1="295" y1="91" x2="295" y2="99" stroke="#4a5568" stroke-width="1.2"/><text x="295" y="113" font-size="11" fill="#4a5568" text-anchor="middle">3</text><line x1="350" y1="91" x2="350" y2="99" stroke="#4a5568" stroke-width="1.2"/><text x="350" y="113" font-size="11" fill="#4a5568" text-anchor="middle">4</text><line x1="405" y1="91" x2="405" y2="99" stroke="#4a5568" stroke-width="1.2"/><text x="405" y="113" font-size="11" fill="#4a5568" text-anchor="middle">5</text><line x1="460" y1="91" x2="460" y2="99" stroke="#4a5568" stroke-width="1.2"/><text x="460" y="113" font-size="11" fill="#4a5568" text-anchor="middle">6</text><text x="122" y="99" font-size="12" fill="#2b6cb0" text-anchor="end">解集：</text><line x1="350" y1="95" x2="460" y2="95" stroke="#2b6cb0" stroke-width="4.5"/><circle cx="350" cy="95" r="5" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.5"/><circle cx="460" cy="95" r="5" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.5"/><text x="122" y="154" font-size="12" fill="#4a5568" text-anchor="end">整数点：</text><circle cx="130" cy="150" r="4.5" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5"/><circle cx="185" cy="150" r="4.5" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5"/><circle cx="240" cy="150" r="4.5" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5"/><circle cx="295" cy="150" r="4.5" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5"/><circle cx="350" cy="150" r="4.5" fill="#c53030" stroke="#c53030" stroke-width="1.5"/><circle cx="405" cy="150" r="4.5" fill="#c53030" stroke="#c53030" stroke-width="1.5"/><circle cx="460" cy="150" r="4.5" fill="#c53030" stroke="#c53030" stroke-width="1.5"/><text x="405" y="170" font-size="12" fill="#c53030" text-anchor="middle">x = 4、5、6</text><text x="295" y="196" font-size="12" fill="#4a5568" text-anchor="middle">不等式的解集是连续的，但方案数是整数——必须把整段筛成点</text></svg>