<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="540" height="240" role="img" aria-label="数轴从左到右依次是负八、负五、负一点五、零、二、七，说明越往右越大；下方标出负八与负五到原点的距离，负八的距离更长而数值更小">
  <rect width="540" height="240" fill="#ffffff"/>
  <text x="20" y="24" font-size="13" fill="#2d3748">越靠右越大这一条管全部有理数；负数一侧距离越远，位置越靠左</text>

  <line x1="34" y1="120" x2="512" y2="120" stroke="#4a5568" stroke-width="2"/>
  <polygon points="512,120 498,114 498,126" fill="#4a5568"/>

  <g stroke="#4a5568" stroke-width="2">
    <line x1="124" y1="114" x2="124" y2="126"/>
    <line x1="190" y1="114" x2="190" y2="126"/>
    <line x1="267" y1="114" x2="267" y2="126"/>
    <line x1="300" y1="110" x2="300" y2="130"/>
    <line x1="344" y1="114" x2="344" y2="126"/>
    <line x1="454" y1="114" x2="454" y2="126"/>
  </g>

  <g font-size="13" text-anchor="middle">
    <text x="124" y="106" fill="#c53030">−8</text>
    <text x="190" y="106" fill="#c53030">−5</text>
    <text x="267" y="106" fill="#c53030">−1.5</text>
    <text x="300" y="148" fill="#2d3748">0</text>
    <text x="344" y="106" fill="#2b6cb0">+2</text>
    <text x="454" y="106" fill="#2b6cb0">+7</text>
  </g>

  <g>
    <circle cx="124" cy="120" r="4" fill="#c53030"/>
    <circle cx="190" cy="120" r="4" fill="#c53030"/>
    <circle cx="267" cy="120" r="4" fill="#c53030"/>
    <circle cx="300" cy="120" r="4" fill="#2d3748"/>
    <circle cx="344" cy="120" r="4" fill="#2b6cb0"/>
    <circle cx="454" cy="120" r="4" fill="#2b6cb0"/>
  </g>

  <!-- 距离标注 -->
  <g stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="124" y1="130" x2="124" y2="172" stroke="#c53030"/>
    <line x1="300" y1="130" x2="300" y2="172" stroke="#c53030"/>
    <line x1="190" y1="130" x2="190" y2="196" stroke="#718096"/>
    <line x1="300" y1="130" x2="300" y2="196" stroke="#718096"/>
  </g>
  <g stroke-width="1.5">
    <line x1="124" y1="172" x2="300" y2="172" stroke="#c53030"/>
    <line x1="190" y1="196" x2="300" y2="196" stroke="#718096"/>
  </g>
  <text x="212" y="167" font-size="12.5" fill="#c53030" text-anchor="middle">|−8| = 8</text>
  <text x="245" y="212" font-size="12.5" fill="#718096" text-anchor="middle">|−5| = 5</text>

  <text x="20" y="232" font-size="12" fill="#2d3748">8 &gt; 5，但 −8 在 −5 的左边，所以 −8 &lt; −5：两个负数比大小，绝对值大的反而小</text>
</svg>
