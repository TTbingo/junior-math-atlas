<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"><rect width="760" height="340" fill="#ffffff"/><text x="200.0" y="40.0" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">① 内角和：拆三角形</text><polygon points="200.0,75.0 304.6,151.0 264.7,274.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8" stroke-linejoin="round"/><polygon points="200.0,75.0 264.7,274.0 135.3,274.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round"/><polygon points="200.0,75.0 135.3,274.0 95.4,151.0" fill="#fef3c7" stroke="#b45309" stroke-width="1.8" stroke-linejoin="round"/><polygon points="200.0,75.0 304.6,151.0 264.7,274.0 135.3,274.0 95.4,151.0" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/><line x1="200.0" y1="75.0" x2="264.7" y2="274.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/><line x1="200.0" y1="75.0" x2="135.3" y2="274.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/><circle cx="200.0" cy="75.0" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="200.0" y="63.0" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">A</text><circle cx="304.6" cy="151.0" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="318.6" y="155.0" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">B</text><circle cx="264.7" cy="274.0" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="276.7" y="292.0" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">C</text><circle cx="135.3" cy="274.0" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="125.3" y="292.0" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">D</text><circle cx="95.4" cy="151.0" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="81.4" y="155.0" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">E</text><text x="200.0" y="316.0" font-size="12" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">从 A 出发的 2 条对角线，分成 3 个三角形</text><text x="200.0" y="336.0" font-size="13" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">内角和 = 3×180° = 540°</text><text x="580.0" y="40.0" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">② 外角和：走一圈</text><polygon points="580.0,98.0 656.1,153.3 627.0,242.7 533.0,242.7 503.9,153.3" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/><path d="M 594.6 87.4 A 18 18 0 0 1 594.6 108.6" fill="none" stroke="#dc2626" stroke-width="1.8"/><path d="M 670.6 163.9 A 18 18 0 0 1 650.5 170.4" fill="none" stroke="#dc2626" stroke-width="1.8"/><line x1="656.1" y1="153.3" x2="683.6" y2="173.3" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><text x="670.9" y="198.9" font-size="12" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">72°</text><path d="M 621.5 259.8 A 18 18 0 0 1 609.0 242.7" fill="none" stroke="#dc2626" stroke-width="1.8"/><path d="M 515.0 242.7 A 18 18 0 0 1 527.4 225.6" fill="none" stroke="#dc2626" stroke-width="1.8"/><line x1="533.0" y1="242.7" x2="499.0" y2="242.7" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><text x="571.8" y="270.9" font-size="12" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">72°</text><path d="M 498.4 136.2 A 18 18 0 0 1 518.5 142.7" fill="none" stroke="#dc2626" stroke-width="1.8"/><text x="580.0" y="316.0" font-size="12" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">每个外角 72°（沿边走，每个顶点转一次）</text><text x="580.0" y="336.0" font-size="13" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">外角和 = 5×72° = 360°，与边数无关</text></svg>