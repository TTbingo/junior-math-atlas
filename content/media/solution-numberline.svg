<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 265" width="560" height="265" role="img" aria-label="三条上下对齐的数轴：第一条在 2 处空心圆向右粗线表示 x 大于 2，第二条在 4 处实心圆向左粗线表示 x 小于等于 4，第三条画出重叠部分，从 2 空心到 4 实心"><rect width="560" height="265" fill="#ffffff"/><text x="120" y="42" font-size="13" fill="#2d3748" text-anchor="start">① 2x − 1 &gt; 3，解得 x &gt; 2</text><line x1="120" y1="60" x2="410" y2="60" stroke="#4a5568" stroke-width="1.5"/><line x1="120" y1="56" x2="120" y2="64" stroke="#4a5568" stroke-width="1.2"/><text x="120" y="78" font-size="11" fill="#4a5568" text-anchor="middle">0</text><line x1="178" y1="56" x2="178" y2="64" stroke="#4a5568" stroke-width="1.2"/><text x="178" y="78" font-size="11" fill="#4a5568" text-anchor="middle">1</text><line x1="236" y1="56" x2="236" y2="64" stroke="#4a5568" stroke-width="1.2"/><text x="236" y="78" font-size="11" fill="#4a5568" text-anchor="middle">2</text><line x1="294" y1="56" x2="294" y2="64" stroke="#4a5568" stroke-width="1.2"/><text x="294" y="78" font-size="11" fill="#4a5568" text-anchor="middle">3</text><line x1="352" y1="56" x2="352" y2="64" stroke="#4a5568" stroke-width="1.2"/><text x="352" y="78" font-size="11" fill="#4a5568" text-anchor="middle">4</text><line x1="410" y1="56" x2="410" y2="64" stroke="#4a5568" stroke-width="1.2"/><text x="410" y="78" font-size="11" fill="#4a5568" text-anchor="middle">5</text><line x1="236" y1="60" x2="404" y2="60" stroke="#2b6cb0" stroke-width="4"/><polygon points="414,60 404.0,66.0 404.0,54.0" fill="#2b6cb0"/><circle cx="236" cy="60" r="5" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/><text x="120" y="112" font-size="13" fill="#2d3748" text-anchor="start">② x − 3 ≤ 1，解得 x ≤ 4</text><line x1="120" y1="130" x2="410" y2="130" stroke="#4a5568" stroke-width="1.5"/><line x1="120" y1="126" x2="120" y2="134" stroke="#4a5568" stroke-width="1.2"/><text x="120" y="148" font-size="11" fill="#4a5568" text-anchor="middle">0</text><line x1="178" y1="126" x2="178" y2="134" stroke="#4a5568" stroke-width="1.2"/><text x="178" y="148" font-size="11" fill="#4a5568" text-anchor="middle">1</text><line x1="236" y1="126" x2="236" y2="134" stroke="#4a5568" stroke-width="1.2"/><text x="236" y="148" font-size="11" fill="#4a5568" text-anchor="middle">2</text><line x1="294" y1="126" x2="294" y2="134" stroke="#4a5568" stroke-width="1.2"/><text x="294" y="148" font-size="11" fill="#4a5568" text-anchor="middle">3</text><line x1="352" y1="126" x2="352" y2="134" stroke="#4a5568" stroke-width="1.2"/><text x="352" y="148" font-size="11" fill="#4a5568" text-anchor="middle">4</text><line x1="410" y1="126" x2="410" y2="134" stroke="#4a5568" stroke-width="1.2"/><text x="410" y="148" font-size="11" fill="#4a5568" text-anchor="middle">5</text><line x1="126" y1="130" x2="352" y2="130" stroke="#2f855a" stroke-width="4"/><polygon points="116,130 126.0,124.0 126.0,136.0" fill="#2f855a"/><circle cx="352" cy="130" r="5" fill="#2f855a" stroke="#2f855a" stroke-width="1.5"/><text x="120" y="182" font-size="13" font-weight="600" fill="#c53030" text-anchor="start">同一条数轴上取重叠：2 &lt; x ≤ 4</text><line x1="120" y1="200" x2="410" y2="200" stroke="#4a5568" stroke-width="1.5"/><line x1="120" y1="196" x2="120" y2="204" stroke="#4a5568" stroke-width="1.2"/><text x="120" y="218" font-size="11" fill="#4a5568" text-anchor="middle">0</text><line x1="178" y1="196" x2="178" y2="204" stroke="#4a5568" stroke-width="1.2"/><text x="178" y="218" font-size="11" fill="#4a5568" text-anchor="middle">1</text><line x1="236" y1="196" x2="236" y2="204" stroke="#4a5568" stroke-width="1.2"/><text x="236" y="218" font-size="11" fill="#4a5568" text-anchor="middle">2</text><line x1="294" y1="196" x2="294" y2="204" stroke="#4a5568" stroke-width="1.2"/><text x="294" y="218" font-size="11" fill="#4a5568" text-anchor="middle">3</text><line x1="352" y1="196" x2="352" y2="204" stroke="#4a5568" stroke-width="1.2"/><text x="352" y="218" font-size="11" fill="#4a5568" text-anchor="middle">4</text><line x1="410" y1="196" x2="410" y2="204" stroke="#4a5568" stroke-width="1.2"/><text x="410" y="218" font-size="11" fill="#4a5568" text-anchor="middle">5</text><line x1="236" y1="200" x2="352" y2="200" stroke="#c53030" stroke-width="4.5"/><circle cx="236" cy="200" r="5" fill="#ffffff" stroke="#c53030" stroke-width="2"/><circle cx="352" cy="200" r="5" fill="#c53030" stroke="#c53030" stroke-width="1.5"/><text x="265" y="246" font-size="12" fill="#4a5568" text-anchor="middle">空心 = 取不到，实心 = 取得到；重叠段照抄两头的开闭</text></svg>