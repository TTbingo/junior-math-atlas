<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"><rect width="760" height="380" fill="#ffffff"/><text x="380.0" y="28.0" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">作线段 AB 的垂直平分线</text><path d="M 380.0 88.2 A 150 150 0 0 0 254.0 52.3" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M 380.0 88.2 A 150 150 0 0 1 506.0 52.3" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M 380.0 311.8 A 150 150 0 0 1 254.0 347.7" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M 380.0 311.8 A 150 150 0 0 0 506.0 347.7" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="280.0" y1="200.0" x2="480.0" y2="200.0" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/><line x1="380.0" y1="88.2" x2="380.0" y2="311.8" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/><circle cx="280.0" cy="200.0" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="268.0" y="220.0" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">A</text><circle cx="480.0" cy="200.0" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="492.0" y="220.0" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">B</text><circle cx="380.0" cy="88.2" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="364.0" y="82.2" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">C</text><circle cx="380.0" cy="311.8" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="394.0" y="315.8" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">D</text><polygon points="390.0,200.0 390.0,210.0 380.0,210.0" fill="none" stroke="#1f2937" stroke-width="1.4" stroke-linejoin="round"/><text x="394.0" y="186.0" font-size="12" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">M（中点）</text><text x="40.0" y="150.0" font-size="12" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">以 A、B 为圆心，</text><text x="40.0" y="172.0" font-size="12" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">等长半径（大于 AB 一半）</text><text x="40.0" y="194.0" font-size="12" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">画弧，两弧交于 C、D。</text><text x="40.0" y="230.0" font-size="12" fill="#dc2626" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-weight="bold">CA=CB、DA=DB</text><text x="40.0" y="252.0" font-size="12" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">（同一半径），</text><text x="40.0" y="274.0" font-size="12" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">CD 就是垂直平分线。</text></svg>