<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" role="img" aria-label="左边是边长为 a 加 b 的正方形切成四块，分别标 a 平方、ab、ab、b 平方；右边是 a 平方剪掉 b 平方后重拼成的长方形，长 a 加 b、宽 a 减 b">
  <rect width="560" height="260" fill="#ffffff"/>
  <!-- 左图：完全平方 -->
  <text x="120" y="18" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">(a+b)² 切四块</text>
  <rect x="40" y="40" width="160" height="160" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <rect x="140" y="40" width="60" height="100" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/>
  <rect x="40" y="140" width="100" height="60" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/>
  <rect x="140" y="140" width="60" height="60" fill="#f0fff4" stroke="#2f855a" stroke-width="1.5"/>
  <text x="90" y="95" font-size="15" fill="#2b6cb0" text-anchor="middle">a²</text>
  <text x="170" y="95" font-size="15" fill="#b7791f" text-anchor="middle">ab</text>
  <text x="90" y="175" font-size="15" fill="#b7791f" text-anchor="middle">ab</text>
  <text x="170" y="175" font-size="15" fill="#2f855a" text-anchor="middle">b²</text>
  <text x="90" y="36" font-size="13" fill="#4a5568" text-anchor="middle">a</text>
  <text x="170" y="36" font-size="13" fill="#4a5568" text-anchor="middle">b</text>
  <text x="26" y="95" font-size="13" fill="#4a5568" text-anchor="middle">a</text>
  <text x="26" y="175" font-size="13" fill="#4a5568" text-anchor="middle">b</text>
  <text x="120" y="228" font-size="14" fill="#c53030" text-anchor="middle">(a+b)² = a² + 2ab + b²</text>

  <!-- 右图：平方差 -->
  <text x="390" y="18" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">a² 剪掉 b² 重拼</text>
  <rect x="300" y="50" width="100" height="100" fill="none" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="340" y="50" width="60" height="60" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="370" y="84" font-size="12" fill="#718096" text-anchor="middle">减去 b²</text>
  <rect x="300" y="110" width="160" height="40" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <rect x="400" y="110" width="60" height="40" fill="#f0fff4" stroke="#2f855a" stroke-width="1.5"/>
  <text x="350" y="135" font-size="13" fill="#2b6cb0" text-anchor="middle">a(a−b)</text>
  <text x="430" y="135" font-size="13" fill="#2f855a" text-anchor="middle">b(a−b)</text>
  <text x="380" y="44" font-size="13" fill="#4a5568" text-anchor="middle">a + b</text>
  <line x1="300" y1="166" x2="460" y2="166" stroke="#4a5568" stroke-width="1"/>
  <line x1="300" y1="162" x2="300" y2="170" stroke="#4a5568" stroke-width="1"/>
  <line x1="460" y1="162" x2="460" y2="170" stroke="#4a5568" stroke-width="1"/>
  <text x="380" y="182" font-size="12" fill="#4a5568" text-anchor="middle">长 a+b，宽 a−b</text>
  <text x="390" y="228" font-size="14" fill="#c53030" text-anchor="middle">a² − b² = (a+b)(a−b)</text>
</svg>
