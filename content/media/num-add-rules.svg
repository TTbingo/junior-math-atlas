<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" role="img" aria-label="一条数轴上演示两组加法：第一组从零向左走五格再向右走三格，落在负二；第二组从零向左走四格再向左走三格，落在负七">
  <rect width="540" height="250" fill="#ffffff"/>
  <text x="20" y="24" font-size="13" fill="#2d3748">加法就是连续走两段：方向相同则路程相加，方向相反则互相抵消</text>

  <line x1="30" y1="185" x2="512" y2="185" stroke="#4a5568" stroke-width="2"/>
  <polygon points="512,185 498,179 498,191" fill="#4a5568"/>

  <g stroke="#4a5568" stroke-width="2">
    <line x1="78" y1="179" x2="78" y2="191"/>
    <line x1="102" y1="179" x2="102" y2="191"/>
    <line x1="126" y1="179" x2="126" y2="191"/>
    <line x1="150" y1="179" x2="150" y2="191"/>
    <line x1="174" y1="179" x2="174" y2="191"/>
    <line x1="198" y1="179" x2="198" y2="191"/>
    <line x1="222" y1="179" x2="222" y2="191"/>
    <line x1="270" y1="176" x2="270" y2="196"/>
    <line x1="294" y1="179" x2="294" y2="191"/>
    <line x1="318" y1="179" x2="318" y2="191"/>
  </g>
  <g font-size="12" fill="#2d3748" text-anchor="middle">
    <text x="78" y="208">−8</text>
    <text x="126" y="208" fill="#a0aec0">−6</text>
    <text x="174" y="208" fill="#a0aec0">−4</text>
    <text x="222" y="208" fill="#a0aec0">−2</text>
    <text x="270" y="208">0</text>
    <text x="318" y="208" fill="#a0aec0">2</text>
  </g>

  <!-- 第一组 -->
  <line x1="270" y1="106" x2="150" y2="106" stroke="#c53030" stroke-width="2.5"/>
  <polygon points="144,106 156,100 156,112" fill="#c53030"/>
  <text x="210" y="98" font-size="12.5" fill="#c53030" text-anchor="middle">−5</text>

  <line x1="150" y1="132" x2="222" y2="132" stroke="#2b6cb0" stroke-width="2.5"/>
  <polygon points="228,132 216,126 216,138" fill="#2b6cb0"/>
  <text x="186" y="152" font-size="12.5" fill="#2b6cb0" text-anchor="middle">+3</text>

  <g stroke="#a0aec0" stroke-width="1" stroke-dasharray="3 3">
    <line x1="270" y1="106" x2="270" y2="176"/>
    <line x1="150" y1="106" x2="150" y2="176"/>
    <line x1="222" y1="132" x2="222" y2="176"/>
  </g>
  <circle cx="222" cy="185" r="5" fill="#2d3748"/>
  <text x="240" y="172" font-size="12.5" fill="#2d3748">落点 −2：异号相加，取绝对值大的符号</text>

  <!-- 第二组 -->
  <line x1="270" y1="40" x2="174" y2="40" stroke="#c53030" stroke-width="2.5"/>
  <polygon points="168,40 180,34 180,46" fill="#c53030"/>
  <text x="222" y="32" font-size="12.5" fill="#c53030" text-anchor="middle">−4</text>

  <line x1="174" y1="62" x2="102" y2="62" stroke="#c53030" stroke-width="2.5"/>
  <polygon points="96,62 108,56 108,68" fill="#c53030"/>
  <text x="138" y="82" font-size="12.5" fill="#c53030" text-anchor="middle">−3</text>

  <g stroke="#a0aec0" stroke-width="1" stroke-dasharray="3 3">
    <line x1="174" y1="40" x2="174" y2="176"/>
    <line x1="102" y1="62" x2="102" y2="176"/>
  </g>
  <circle cx="102" cy="185" r="5" fill="#2d3748"/>
  <text x="112" y="232" font-size="12.5" fill="#2d3748">落点 −7：同号相加，符号不变、绝对值相加</text>
</svg>
